<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Enhancer Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="card__header">
      <div class="brand">
        <span class="brand__logo">✨</span>
        <h2 class="brand__title">Prompt Enhancer</h2>
      </div>
      <p class="subtitle">Choose an AI provider and configure its API key.</p>
    </div>

    <form id="apiForm">
      <label for="providerSelect" class="label">AI Provider</label>
      <div class="field-full">
        <select id="providerSelect" class="input">
          <option value="openrouter">OpenRouter</option>
          <option value="groq">Groq</option>
        </select>
      </div>

      <label for="apiKey" class="label" id="apiKeyLabel">OpenRouter API Key</label>
      <div class="field">
        <input type="password" id="apiKey" class="input" placeholder="sk-or-v1-..." autocomplete="off">
        <button type="button" class="icon-btn" id="toggleVis" title="Show/Hide">👁️</button>
        <button type="button" class="icon-btn" id="copyKey" title="Copy">📋</button>
      </div>

        <label for="modelSelect" class="label" id="modelLabel">OpenRouter Model</label>
      <div class="field-full">
		<select id="modelSelect" class="input">
		</select>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary" id="save">Save Settings</button>
        <button type="button" class="btn ghost" id="clear">Clear</button>
      </div>
    </form>

    <div class="footer">
      <small class="hint">Keyboard Shortcut: Ctrl+Shift+E</small>
    </div>
  </div>

  <div id="toast" class="toast">Settings saved.</div>
  <script src="popup.js"></script>
</body>
</html>
